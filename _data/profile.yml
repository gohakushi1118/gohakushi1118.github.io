  - title: Research
    intro: Some Paper...
    items:
      - title: Evaluating the Performance of Open-Vocabulary Object Detection in Low-quality Image
        image: lq.jpg
        authors: "**Po-Chih Wu**"
        venue: arXiv
        year: 2025
        links:
          - name: arxiv
            url: https://arxiv.org/abs/2512.22801
          - name: dataset
            url: https://www.kaggle.com/datasets/pochihwu/low-quality-image-dataset
          - name: code
            url: https://github.com/gohakushi1118/Low-quality-image-dataset
        description: >-
          Due to the scarcity of suitable image datasets online related to low-quality images,
          we created a new dataset for this study. Low-quality image dataset is based on the
          COCO 2017 validation set, with images processed into four categories, including lossy
          compression, image intensity, image noise, and image blur. In total, the dataset
          comprises 100,000 processed images. Each low-quality category includes five levels of
          image degradation with 5,000 processed images per level.

