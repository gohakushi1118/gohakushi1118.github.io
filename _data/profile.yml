  - title: Research
    items:
      - title: Evaluating the Performance of Open-Vocabulary Object Detection in Low-quality Image
        image: lq.jpg
        authors: "**Po-Chih Wu**"
        venue: arXiv
        year: 2025
        links:
          - name: arxiv
            url: https://arxiv.org/abs/2512.22801
          - name: dataset
            url: https://www.kaggle.com/datasets/pochihwu/low-quality-image-dataset
          - name: code
            url: https://github.com/gohakushi1118/Low-quality-image-dataset
        description: >-
          Due to the scarcity of suitable image datasets online related to low-quality images,
          we created a new dataset for this study. Low-quality image dataset is based on the
          COCO 2017 validation set, with images processed into four categories, including lossy
          compression, image intensity, image noise, and image blur. In total, the dataset
          comprises 100,000 processed images. Each low-quality category includes five levels of
          image degradation with 5,000 processed images per level.

  - title: Projects
    layout: grid
    items:
      - title: Intro to Computer Vision and Computational Photography Projects
        image: cs180.jpg
        venue: Self Practice
        year: 2026
        links:
          - name: code
            url: https://github.com/gohakushi1118/Intro-to-Computer-Vision-and-Computational-Photography
        description: >-
          CS180 is a publicly available course from UC Berkeley that includes five projects: Alignment & Colorization, Sharpening & Hybrid Images, Image Warping, (Auto) Stitching, and Image Generation Models. Since I will be conducting research in computer vision, I have been building up my knowledge and hands-on technical experience in the field through these projects.
      - title: Machine Learning Projects
        image: ml.png
        venue: Self Practice
        year: 2026
        links:
          - name: code
            url: https://github.com/gohakushi1118/Machine-Learning
        description: >-
          Machine Learning, taught by Prof. Hung-yi Lee, is a publicly available course. I completed four main projects, including CNN, Autoencoder, Diffusion Model, and Adaptation. Through implementing these projects, I learned PyTorch, NumPy, and CUDA, along with machine learning theory, and built a solid foundation in the field.




